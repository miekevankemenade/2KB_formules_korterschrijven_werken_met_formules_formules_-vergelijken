<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Werken met formules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap">
<style>
:root{
  --roze:#E924D5; --paars:#5E0696; --cyaan:#45EDFF;
  --bg:#FBF7FE; --vlak:#FFFFFF; --lijn:#E6D8F2; --tekst:#2A0A46; --zacht:#6B5A80;
  --goed:#16965A; --fout:#E21E2D; --roze-licht:#FCE6FA; --paars-licht:#F1E6FA; --cyaan-licht:#DDFBFF;
  --font:'Montserrat', 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box}
.app>*{min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tekst);font-family:var(--font);font-size:17px;line-height:1.55}
button,input,select{font-family:inherit;font-size:inherit}
i,.var{font-style:italic;font-weight:600}
.app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;height:100dvh}
/* ---------- kop ---------- */
header{background:var(--paars);color:#fff;padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right));display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:5px solid var(--roze)}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:20px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.tab.actief{background:var(--cyaan);color:var(--paars)}
.kop-rechts{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
.kop-rechts .naam{opacity:.85}
.knop-klein{background:var(--roze);color:#fff;border:0;border-radius:20px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px}
/* ---------- strook met onderdelen ---------- */
.strook{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--vlak);border-bottom:1px solid var(--lijn)}
.stip{flex:0 0 auto;min-width:44px;height:32px;border-radius:16px;border:2px solid var(--lijn);background:var(--vlak);color:var(--tekst);font-weight:700;font-size:13px;cursor:pointer;padding:0 8px}
.stip.theorie{border-color:var(--cyaan);background:var(--cyaan-licht)}
.stip.goed2{background:var(--goed);border-color:var(--goed);color:#fff}
.stip.goed1{background:#7cc9a3;border-color:#7cc9a3;color:#fff}
.stip.goed0{background:#f3b6bb;border-color:#f3b6bb}
.stip.bezig{border-color:var(--roze)}
.stip.huidig{outline:3px solid var(--paars);outline-offset:1px}
/* ---------- hoofdvlak ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.links,.rechts{min-height:0;overflow:auto;padding:22px max(16px,env(safe-area-inset-left)) 22px 24px}
.links{background:var(--vlak);border-right:1px solid var(--lijn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.rechts{padding-right:max(24px,env(safe-area-inset-right))}
.label-domein{display:inline-block;font-size:12px;font-weight:600;color:var(--paars);background:var(--paars-licht);border-radius:12px;padding:3px 10px;margin-bottom:10px}
.opdr-nr{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}
.opdr-nr b{font-size:34px;font-weight:800;color:var(--roze);line-height:1}
.opdr-nr span{font-size:20px;font-weight:700;color:var(--paars)}
.zin{display:block}
.blok{margin-bottom:18px}
.vraag{font-weight:600;color:var(--paars)}
.witregel{height:18px}
/* invoer */
.antw-rij{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
input.inv{border:2px solid var(--lijn);border-radius:10px;padding:10px 12px;min-width:0;width:200px;background:#fff;color:var(--tekst)}
input.inv:focus{outline:none;border-color:var(--roze);box-shadow:0 0 0 3px var(--roze-licht)}
input.inv.breed{width:min(100%,360px)}
input.inv.goed{border-color:var(--goed);background:#eaf8f1}
input.inv.fout{border-color:var(--fout);background:#fdeced}
.knoppen{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.knop{border:0;border-radius:24px;padding:11px 22px;font-weight:700;cursor:pointer}
.knop:focus-visible,.tab:focus-visible,.stip:focus-visible,.optie:focus-visible{outline:3px solid var(--cyaan);outline-offset:2px}
.knop.hoofd{background:var(--roze);color:#fff}
.knop.paars{background:var(--paars);color:#fff}
.knop.licht{background:var(--paars-licht);color:var(--paars)}
.knop:disabled{opacity:.45;cursor:default}
.feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.feedback.goed{display:block;background:#eaf8f1;color:var(--goed)}
.feedback.fout{display:block;background:#fdeced;color:var(--fout)}
.feedback.info{display:block;background:var(--cyaan-licht);color:var(--paars)}
.hintvak{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--roze-licht);color:var(--tekst);display:none}
.hintvak.open{display:block}
.hintvak b{color:var(--roze)}
.pogingen{font-size:13px;color:var(--zacht);margin-top:10px}
/* meerkeuze */
.opties{display:grid;gap:10px;margin:12px 0}
.optie{text-align:left;border:2px solid var(--lijn);background:#fff;border-radius:12px;padding:11px 14px;cursor:pointer;color:var(--tekst)}
.optie.gekozen{border-color:var(--roze);background:var(--roze-licht)}
.optie.goed{border-color:var(--goed);background:#eaf8f1}
.optie.fout{border-color:var(--fout);background:#fdeced}
/* tabellen: altijd helemaal zichtbaar, geen schuifbalk */
.tabel-wrap{max-width:100%;overflow:visible}
table.wt{border-collapse:collapse;margin:8px 0;font-variant-numeric:tabular-nums;width:100%;max-width:640px;table-layout:fixed}
table.wt th,table.wt td{padding:6px 3px;text-align:center;min-width:0}
table.wt th{font-weight:600}
table.wt tr:first-child>*{border-bottom:2px solid var(--paars)}
table.wt th:first-child,table.wt td:first-child{border-right:2px solid var(--paars);text-align:left;padding-right:8px;width:7.5em;white-space:normal;line-height:1.25}
table.wt td+td,table.wt th+th{border-left:1px solid var(--paars)}
table.wt input{width:100%;max-width:64px;min-width:0;text-align:center;border:2px solid var(--lijn);border-radius:8px;padding:6px 1px}
table.wt input.goed{border-color:var(--goed);background:#eaf8f1}
table.wt input.fout{border-color:var(--fout);background:#fdeced}
table.wt.kort th:first-child,table.wt.kort td:first-child{width:3em}
@media (max-width:520px){table.wt{font-size:14px} table.wt.kort th:first-child,table.wt.kort td:first-child{width:2.2em} table.wt th:first-child,table.wt td:first-child{width:5.2em;padding-right:4px} table.wt input{font-size:14px;padding:5px 0;border-radius:6px}}
.gegeven{font-weight:700;color:var(--paars)}
/* stappen */
.stappen{display:grid;gap:10px;margin:12px 0}
.stap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stap .lab{min-width:170px;font-weight:600}
.stap input{width:120px}
.formulestap{font-size:22px;font-weight:600;color:var(--paars);gap:6px}
.stap.start{font-size:22px;font-weight:600;color:var(--paars);margin-top:8px}
input.inv.vak{width:84px;text-align:center;font-size:20px;padding:6px 4px}
.stap select{border:2px solid var(--lijn);border-radius:10px;padding:9px 10px;background:#fff}
/* visueel links */
.kaart{background:var(--bg);border:2px solid var(--lijn);border-radius:18px;padding:22px 26px;max-width:100%}
.kaart.formule{font-size:30px;font-weight:600;color:var(--paars);text-align:center}
.kaart .kl{font-size:14px;font-weight:700;color:var(--roze);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.formulelijst{display:grid;gap:10px;font-size:24px;color:var(--paars);font-weight:600}
.formulelijst .nr{color:var(--roze);font-weight:800;margin-right:10px}
svg.graf{width:100%;max-width:560px;height:auto;touch-action:manipulation;user-select:none}
svg.graf .klik{cursor:crosshair}
.graf-uitleg{font-size:14px;color:var(--zacht);text-align:center;max-width:520px}
video{width:100%;max-width:820px;border-radius:14px;background:#000;box-shadow:0 8px 30px rgba(94,6,150,.18)}
.theorie-tekst{background:var(--cyaan-licht);border-radius:16px;padding:18px 20px;margin:12px 0}
.theorie-tekst b{color:var(--paars)}
/* voet */
footer{display:flex;gap:10px;align-items:center;padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right));background:var(--vlak);border-top:1px solid var(--lijn)}
footer .spacer{flex:1}
.voortgang{font-size:14px;color:var(--zacht);font-weight:600}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(42,10,70,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay[hidden]{display:none!important}
.ov-doos{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:26px 28px;border-top:8px solid var(--cyaan)}
.ov-doos h2{margin:0 0 6px;color:var(--paars)}
.ov-stap{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;padding:10px 14px;border-radius:12px;background:var(--bg);margin:8px 0;font-size:20px;font-weight:600}
.ov-stap.zichtbaar{opacity:1;transform:none}
.ov-stap .nr{display:inline-block;width:28px;height:28px;border-radius:50%;background:var(--roze);color:#fff;text-align:center;line-height:28px;font-size:14px;margin-right:10px}
/* start en eind */
.scherm{min-height:0;overflow:auto;width:100%;max-width:860px;margin:0 auto;padding:30px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
.scherm h2{color:var(--paars);font-size:30px;margin:0 0 8px}
.cijfer{font-size:64px;font-weight:800;color:var(--roze);line-height:1}
.tegels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.tegel{background:#fff;border:2px solid var(--lijn);border-radius:16px;padding:14px 16px}
.tegel .k{font-size:13px;color:var(--zacht);font-weight:600}
.tegel .w{font-size:26px;font-weight:800;color:var(--paars)}
.pil{display:inline-block;padding:3px 12px;border-radius:12px;font-weight:700;font-size:14px}
.pil.laag{background:#eaf8f1;color:var(--goed)} .pil.gemiddeld{background:#fff4d6;color:#9a6a00} .pil.hoog{background:#fdeced;color:var(--fout)}
.analyse{background:#fff;border:2px solid var(--lijn);border-radius:16px;padding:16px 18px;margin:14px 0}
.analyse li{margin:4px 0}
pre.export{white-space:pre-wrap;background:var(--paars-licht);border-radius:12px;padding:14px;font-size:14px;max-height:280px;overflow:auto}
.status{font-size:14px;font-weight:600;margin-top:8px}
.code{font-family:'Courier New',monospace;font-size:20px;letter-spacing:2px;color:var(--roze)}
.code-groot{font-family:'Courier New',monospace;font-size:44px;font-weight:700;letter-spacing:6px;color:var(--paars);background:var(--cyaan-licht);border-radius:14px;text-align:center;padding:16px;margin:12px 0}
.startkeuze{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.startkeuze[hidden]{display:none!important}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .app{height:auto;min-height:100vh}
  .links,.rechts{overflow:visible;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .links{border-right:0;border-bottom:1px solid var(--lijn)}
  .stap .lab{min-width:0}
}
/* rekenmachine (examenmodel) */
.rm{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));width:330px;max-width:calc(100vw - 24px);max-height:calc(100vh - 20px);overflow:auto;background:#555;border:1px solid #333;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:40;touch-action:none;font-family:Arial,Helvetica,sans-serif}
.rm[hidden]{display:none!important}
@media (min-width:861px){.rm{right:auto;left:max(16px,env(safe-area-inset-left))}}
.rm-kop{display:flex;align-items:center;gap:10px;cursor:move;background:#fff;border-bottom:3px solid var(--paars);padding:8px 12px;border-radius:14px 14px 0 0;font-weight:700;color:var(--paars);font-size:20px;user-select:none;font-family:var(--font)}
.rm-kop .pijlknop{margin-left:0;border:0;width:auto;height:auto;font-size:14px;padding:2px 6px}
.rm.ingeklapt .rm-lijf{display:none}
.rm-kop button{margin-left:auto;border:2px solid var(--paars);background:#fff;color:var(--paars);border-radius:4px;width:30px;height:30px;font-weight:800;font-size:16px;cursor:pointer;line-height:1}
.rm-lijf{padding:10px 12px 14px}
.rm-lcd{background:#e9e985;border:3px solid #333;border-radius:10px;height:112px;padding:6px 10px;display:flex;flex-direction:column;justify-content:space-between;color:#111;font-family:'Courier New',monospace;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.rm-ind{display:flex;gap:10px;font-size:11px;font-weight:700;min-height:13px;font-family:Arial,sans-serif}
.rm-in{font-size:19px;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;direction:ltr;cursor:text;min-height:26px;padding:2px 0}
.rm-in::-webkit-scrollbar{display:none}
.rm-in .tk{padding:0 0.5px}
.rm-in .tk:hover{background:rgba(0,0,0,.08);border-radius:3px}
.rm-uit.oud{opacity:.35}
.rm-tip{font-size:11px;color:#ddd;margin-top:5px;font-family:var(--font)}
.rm-in .caret{display:inline-block;width:2px;height:20px;background:#111;vertical-align:middle;animation:knipper 1s steps(1) infinite}
@keyframes knipper{50%{opacity:0}}
.rm-uit{font-size:26px;font-weight:700;text-align:right;white-space:nowrap;overflow:hidden;display:flex;justify-content:flex-end;align-items:center;min-height:36px}
.breuk{display:inline-flex;flex-direction:column;align-items:center;font-size:18px;line-height:1.05;vertical-align:middle;margin:0 2px}
.breuk span:first-child{border-bottom:2px solid #111;padding:0 3px}
.rm-in sup{font-size:12px}
.rm-modus{display:flex;gap:18px;margin:8px 2px 6px;color:#fff;font-weight:700;font-size:16px}
.rm-modus label{display:flex;align-items:center;gap:6px;cursor:pointer}
.rm-modus input{width:22px;height:22px;accent-color:#1e6cff;margin:0}
.rm-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px 6px}
.rm-lbl{font-size:10px;color:#f0a830;text-align:center;align-self:end;min-height:12px;font-weight:700}
.rm-grid button{border:0;border-radius:4px;padding:8px 0;font-size:17px;font-weight:700;cursor:pointer;background:#ddd;color:#111;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);font-family:'Times New Roman',serif}
.rm-grid button:active{transform:translateY(1px);box-shadow:none}
.rm-grid button.cijfer{background:#2a2a2a;color:#fff;font-size:24px;padding:6px 0;font-family:Arial,sans-serif}
.rm-grid button.rood{background:#c0201e;color:#fff;font-family:Arial,sans-serif}
.rm-grid button.blauw{background:#2f7dc0;color:#fff;font-size:24px}
.rm-grid button.ans{background:#8a8a8a;color:#222;font-family:Arial,sans-serif}
.rm-grid button.inv{background:#e39a12;color:#111;font-family:Arial,sans-serif}
.rm-grid button.inv.aan{background:#ffcf4a;outline:3px solid #fff}
.rm-grid button.sym{font-family:Arial,sans-serif}
.rm-tussen{grid-column:1/-1;height:6px}
@media (max-width:520px),(max-height:820px){.rm{width:280px}.rm-kop{font-size:16px;padding:6px 10px}.rm-lijf{padding:8px 10px 10px}.rm-lcd{height:88px}.rm-in{font-size:16px}.rm-uit{font-size:21px;min-height:28px}.rm-modus{font-size:13px;margin:5px 2px 3px}.rm-modus input{width:16px;height:16px}.rm-grid{gap:5px 5px}.rm-grid button{padding:5px 0;font-size:14px}.rm-grid button.cijfer,.rm-grid button.blauw{font-size:19px;padding:4px 0}.rm-lbl{font-size:9px;min-height:10px}}
.rm-grid button.kopieer{grid-column:1/-1;background:#fff;color:var(--paars);font-family:var(--font);font-size:15px;padding:9px 0;margin-top:4px}
.rm-melding{color:#fff;font-size:13px;min-height:18px;margin-top:6px;font-family:var(--font)}
.berekeningen{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.berekening{font-family:'Courier New',monospace;font-size:14px;background:#fff;border:2px solid var(--lijn);border-radius:6px;padding:3px 8px}
.rm{cursor:move}.rm button,.rm input,.rm label,.rm-lcd{cursor:pointer}.rm-lcd{cursor:text}
.knop-klein.rm-knop{background:var(--cyaan);color:var(--paars)}
@media (prefers-reduced-motion:reduce){.ov-stap{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="rm" id="rm" hidden role="dialog" aria-label="Rekenmachine">
  <div class="rm-kop" id="rmKop"><button class="pijlknop" id="rmKlap" aria-label="Rekenmachine inklappen" aria-expanded="true">▼</button>Rekenmachine<button id="rmSluit" aria-label="Rekenmachine sluiten">✕</button></div>
  <div class="rm-lijf">
    <div class="rm-lcd" id="rmLcd" tabindex="0" aria-label="Scherm van de rekenmachine">
      <div class="rm-ind"><span id="rmIndInv"></span><span>D</span><span id="rmIndModus">Math</span></div>
      <div class="rm-in" id="rmIn"></div>
      <div class="rm-uit" id="rmUit" aria-live="polite"></div>
    </div>
    <div class="rm-tip">Getal veranderen? Tik in de som of gebruik ◀ ▶ en DEL. Druk daarna op =.</div>
    <div class="rm-modus" role="radiogroup" aria-label="Weergave">
      <label><input type="radio" name="rmModus" value="math" checked>Mathematisch</label>
      <label><input type="radio" name="rmModus" value="lin">Lineair</label>
    </div>
    <div class="rm-grid" id="rmToetsen">
      <span class="rm-lbl">sin⁻¹</span><span class="rm-lbl">cos⁻¹</span><span class="rm-lbl">tan⁻¹</span><span class="rm-lbl"></span><span class="rm-lbl"></span>
      <button data-t="sin">sin</button><button data-t="cos">cos</button><button data-t="tan">tan</button><button data-t="breuk" aria-label="breuk">▭<br style="line-height:0">▭</button><button data-t="e10" aria-label="keer tien tot de macht"><i>×10<sup>y</sup></i></button>
      <button data-t="wortel" aria-label="wortel">√▢</button><button data-t="kw" aria-label="kwadraat"><i>x</i>²</button><button data-t="macht" aria-label="macht"><i>x</i><sup>▢</sup></button><button data-t="inv1" aria-label="één gedeeld door"><i>x</i>⁻¹</button><button data-t="pi" aria-label="pi">π</button>
      <button class="inv" data-t="INV" id="rmInv">INV</button><button class="sym" data-t="links" aria-label="cursor naar links">◀</button><button class="sym" data-t="rechts" aria-label="cursor naar rechts">▶</button><button class="sym" data-t="haak" aria-label="haakje">( )</button><button class="sym" data-t="fd" aria-label="breuk of decimaal">f↔d</button>
      <span class="rm-lbl"></span><span class="rm-lbl"></span><span class="rm-lbl"></span><span class="rm-lbl"></span><span class="rm-lbl">AC</span>
      <button class="cijfer" data-t="7">7</button><button class="cijfer" data-t="8">8</button><button class="cijfer" data-t="9">9</button><button class="rood" data-t="DEL">DEL</button><button class="rood" data-t="C">C</button>
      <button class="cijfer" data-t="4">4</button><button class="cijfer" data-t="5">5</button><button class="cijfer" data-t="6">6</button><button class="sym" data-t="×" style="font-size:24px">×</button><button class="sym" data-t="÷" style="font-size:24px">÷</button>
      <button class="cijfer" data-t="1">1</button><button class="cijfer" data-t="2">2</button><button class="cijfer" data-t="3">3</button><button class="sym" data-t="+" style="font-size:24px">+</button><button class="sym" data-t="−" style="font-size:24px">−</button>
      <button class="cijfer" data-t="0">0</button><button data-t="," style="font-size:22px">,</button><button class="sym" data-t="neg" aria-label="negatief">(−)</button><button class="ans" data-t="ANS">ANS</button><button class="blauw" data-t="=">=</button>
      <button class="kopieer" data-t="kopieer" id="rmKopieer" title="Zet de berekening en het antwoord in het antwoordvak">⧉ Kopieer naar antwoordvak</button>
    </div>

<script>
"use strict";
/* =========================================================
   HULPFUNCTIES
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VARWOORDEN = ['aantal liters','aantal weken','aantal cakes','aantal','bedrag','tijd','winst'];
// zet losse letters (variabelen) en woordvariabelen cursief
function fmt(s){
  let t = esc(s);
  t = t.replace(/(^|[^A-Za-zÀ-ÿ])([a-z])(?=$|[^A-Za-zÀ-ÿ])/g, '$1<i>$2</i>');
  return t;
}
function fmtF(s){ // formule: ook woordvariabelen cursief
  let t = fmt(s);
  VARWOORDEN.forEach(w => { t = t.replace(new RegExp('(^|[^A-Za-z>])(' + w + ')(?=$|[^A-Za-z<])','g'), '$1<i>$2</i>'); });
  return t;
}
function zinnen(lines){ return lines.map(l => l === '' ? '<div class="witregel"></div>' : `<span class="zin">${fmtF(l)}</span>`).join(''); }
function parseNum(v){
  if (v == null) return NaN;
  let s = String(v).trim().toLowerCase()
    .replace(/[−–—‐‑]/g, '-')
    .replace(/euro|€|liters?|l$|cm|uur|minuten|min$/g, '')
    .replace(/[,.]-+$/, '')            // 21,- en 21.-
    .replace(/\s+/g, '').replace(/^\+/, '')
    .replace(/^-+/, m => m.length % 2 ? '-' : '');   // dubbele min-tekens getypt
  if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  if (s === '' || s === '-') return NaN;
  if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return Number(s);
}
function parseTijd(v){
  const s = String(v).trim().toLowerCase().replace(/^om/, '').replace(/uur/g, '').replace(/\s+/g, ':').replace(/[.u,;h]/g, ':').replace(/:+/g, ':').replace(/^:|:$/g, '');
  const m = s.match(/^(\d{1,2}):?(\d{2})$/);
  if (!m || +m[1] > 23 || +m[2] > 59) return null;
  return Number(m[1]) * 60 + Number(m[2]);
}
const nu = () => Date.now();
const sec = ms => Math.max(0, Math.round(ms / 1000));

/* ---------- formule-parser (voor gelijkwaardigheid) ---------- */
function normFormule(s){
  return String(s).toLowerCase().replace(/^\s*dus\s*/, '').replace(/[−–—‐‑]/g,'-').replace(/[×·∙⋅]/g,'*').replace(/÷|:/g,'/').replace(/,/g,'.').replace(/\s+/g,'').replace(/\.$/, '').replace(/==+/g, '=');
}
// 'x' als keerteken als x geen letter in de formule is
function normFormuleX(s, letters){
  let n = normFormule(s);
  if (!letters.includes('x')) n = n.replace(/x/g, '*');
  return n;
}
function tokens(s){
  const out = []; let i = 0;
  while (i < s.length){
    const c = s[i];
    if (/[0-9.]/.test(c)){ let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; out.push({t:'n', v:parseFloat(s.slice(i,j))}); i = j; continue; }
    if (/[a-z]/.test(c)){ out.push({t:'v', v:c}); i++; continue; }
    if ('+-*/()'.includes(c)){ out.push({t:c}); i++; continue; }
    throw new Error('teken');
  }
  // impliciete vermenigvuldiging invoegen
  const res = [];
  out.forEach((tk, k) => {
    const p = res[res.length - 1];
    if (p && (p.t === 'n' || p.t === 'v' || p.t === ')') && (tk.t === 'n' || tk.t === 'v' || tk.t === '(')) res.push({t:'*', impl:true});
    res.push(tk);
  });
  return res;
}
function parseExpr(s){
  const tk = tokens(s); let p = 0;
  const peek = () => tk[p], eat = t => { if (!tk[p] || tk[p].t !== t) throw new Error('syntax'); p++; };
  function expr(){ let n = term(); while (peek() && (peek().t === '+' || peek().t === '-')){ const o = tk[p++].t; const r = term(); const l = n; n = o === '+' ? (e => l(e) + r(e)) : (e => l(e) - r(e)); } return n; }
  function term(){ let n = unary(); while (peek() && (peek().t === '*' || peek().t === '/')){ const o = tk[p++].t; const r = unary(); const l = n; n = o === '*' ? (e => l(e) * r(e)) : (e => l(e) / r(e)); } return n; }
  function unary(){ if (peek() && peek().t === '-'){ p++; const u = unary(); return e => -u(e); } if (peek() && peek().t === '+'){ p++; return unary(); } return atom(); }
  function atom(){ const t = peek(); if (!t) throw new Error('eind');
    if (t.t === 'n'){ p++; return () => t.v; }
    if (t.t === 'v'){ p++; return e => { if (!(t.v in e)) throw new Error('var:' + t.v); return e[t.v]; }; }
    if (t.t === '('){ p++; const n = expr(); eat(')'); return n; }
    throw new Error('syntax'); }
  const f = expr(); if (p !== tk.length) throw new Error('syntax'); return f;
}
function vergelijking(s){ // geeft {uit, f} of gooit fout
  const n = normFormule(s); const delen = n.split('=');
  if (delen.length !== 2 || !delen[0] || !delen[1]) throw new Error('is');
  if (/^[a-z]$/.test(delen[0]) && !/^[a-z]$/.test(delen[1])) return {uit: delen[0], f: parseExpr(delen[1]), expr: delen[1]};
  if (/^[a-z]$/.test(delen[1])) return {uit: delen[1], f: parseExpr(delen[0]), expr: delen[0]};
  throw new Error('uitvoer');
}
function gelijkwaardig(orig, antw, invoerVars){
  const o = vergelijking(orig); const a = vergelijking(antw);
  if (o.uit !== a.uit) return false;
  const proef = [-3.7, -1, 0, 1.3, 2, 5.5, 10];
  for (let k = 0; k < proef.length; k++){
    const env = {}; invoerVars.forEach((v, j) => env[v] = proef[(k + j * 2) % proef.length] + j * .37);
    const x = o.f(env), y = a.f(env);
    if (!isFinite(y) || Math.abs(x - y) > 1e-6 * Math.max(1, Math.abs(x))) return false;
  }
  return true;
}

/* =========================================================
   GRAFIEK (SVG)
   ========================================================= */
function maakGrafiek(cfg, opties = {}){
  const W = 560, H = 440, m = {l: 54, r: 40, t: 30, b: 50};
  const [x0, x1] = cfg.x, [y0, y1] = cfg.y;
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'graf'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Assenstelsel met ' + cfg.lx + ' horizontaal en ' + cfg.ly + ' verticaal');
  const el = (n, a, txt) => { const e = document.createElementNS(ns, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; };
  const gs = cfg.gridY || cfg.ys, gx = cfg.gridX || cfg.xs;
  for (let v = x0; v <= x1 + 1e-9; v += gx) el('line', {x1: X(v), x2: X(v), y1: Y(y0), y2: Y(y1), stroke: '#E1D2F0', 'stroke-width': 1});
  for (let v = y0; v <= y1 + 1e-9; v += gs) el('line', {x1: X(x0), x2: X(x1), y1: Y(v), y2: Y(v), stroke: '#E1D2F0', 'stroke-width': 1});
  const ax = Math.min(Math.max(0, y0), y1), ay = Math.min(Math.max(0, x0), x1);
  el('line', {x1: X(x0), x2: X(x1) + 14, y1: Y(ax), y2: Y(ax), stroke: '#5E0696', 'stroke-width': 2.5});
  el('line', {x1: X(ay), x2: X(ay), y1: Y(y0), y2: Y(y1) - 14, stroke: '#5E0696', 'stroke-width': 2.5});
  el('path', {d: `M${X(x1)+18},${Y(ax)} l-10,-5 v10 z`, fill: '#5E0696'});
  el('path', {d: `M${X(ay)},${Y(y1)-18} l-5,10 h10 z`, fill: '#5E0696'});
  const lab = cfg.labX || cfg.xs;
  for (let v = x0; v <= x1 + 1e-9; v += lab){ const r = Math.round(v * 100) / 100; if (r === 0 && ay === 0) continue;
    el('text', {x: X(r), y: Y(ax) + 20, 'text-anchor': 'middle', 'font-size': 13, fill: '#2A0A46', 'font-family': 'Montserrat'}, String(r).replace('-', '−')); }
  const laby = cfg.labY || cfg.ys;
  for (let v = y0; v <= y1 + 1e-9; v += laby){ const r = Math.round(v * 100) / 100; if (r === 0) continue;
    el('text', {x: X(ay) - 8, y: Y(r) + 4, 'text-anchor': 'end', 'font-size': 13, fill: '#2A0A46', 'font-family': 'Montserrat'}, String(r).replace('-', '−')); }
  el('text', {x: X(ay) - 8, y: Y(ax) + 20, 'text-anchor': 'end', 'font-size': 13, fill: '#2A0A46', 'font-family': 'Montserrat'}, '0');
  el('text', {x: X(x1) + 4, y: Y(ax) + 38, 'text-anchor': 'end', 'font-size': 14, 'font-style': 'italic', 'font-weight': 600, fill: '#5E0696', 'font-family': 'Montserrat'}, cfg.lx + ' →');
  el('text', {x: X(ay) + 10, y: Y(y1) - 4, 'font-size': 14, 'font-style': 'italic', 'font-weight': 600, fill: '#5E0696', 'font-family': 'Montserrat'}, cfg.ly + ' ↑');
  // vaste lijnen
  (opties.lijnen || []).forEach(L => {
    const pts = []; const st = (x1 - x0) / 200;
    for (let v = x0; v <= x1 + 1e-9; v += st){ const w = L.f(v); if (w >= y0 - 1e-9 && w <= y1 + 1e-9) pts.push([v, w]); }
    if (pts.length > 1) el('line', {x1: X(pts[0][0]), y1: Y(pts[0][1]), x2: X(pts[pts.length-1][0]), y2: Y(pts[pts.length-1][1]), stroke: L.kleur || '#E924D5', 'stroke-width': 3.5, 'stroke-linecap': 'round'});
    if (L.label){ const p = pts[Math.floor(pts.length * (L.pos || .85))]; el('text', {x: X(p[0]) + 8, y: Y(p[1]) - 10, 'font-size': 18, 'font-weight': 800, fill: L.kleur || '#E924D5', 'font-family': 'Montserrat'}, L.label); }
  });
  (opties.punten || []).forEach(([px, py]) => { el('circle', {cx: X(px), cy: Y(py), r: 7, fill: '#5E0696'}); el('text', {x: X(px) + 10, y: Y(py) - 10, 'font-size': 14, 'font-weight': 700, fill: '#5E0696', 'font-family': 'Montserrat'}, `(${px}, ${py})`.replace(/-/g, '−')); });
  // interactief tekenen
  if (opties.interactief){
    const snx = cfg.snapX || 1, sny = cfg.snapY || 1;
    // fijne hulplijnen op de plekken waar een punt kan komen
    if (sny < gs) for (let v = y0; v <= y1 + 1e-9; v += sny) el('line', {x1: X(x0), x2: X(x1), y1: Y(v), y2: Y(v), stroke: '#F1E8F8', 'stroke-width': 1, 'stroke-dasharray': '3 4'});
    const laag = document.createElementNS(ns, 'g'); svg.appendChild(laag);
    const spook = document.createElementNS(ns, 'g'); spook.setAttribute('pointer-events', 'none'); spook.style.display = 'none'; svg.appendChild(spook);
    spook.innerHTML = `<line class="hx" stroke="#45EDFF" stroke-width="2" stroke-dasharray="4 4"/><line class="hy" stroke="#45EDFF" stroke-width="2" stroke-dasharray="4 4"/><circle r="9" fill="none" stroke="#E924D5" stroke-width="3"/><rect rx="8" fill="#5E0696"/><text font-size="15" font-weight="700" fill="#fff" font-family="Montserrat"></text>`;
    const vang = el('rect', {x: m.l - 14, y: m.t - 14, width: W - m.l - m.r + 28, height: H - m.t - m.b + 28, fill: 'transparent', class: 'klik'});
    const naarPunt = ev => {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      const vx = x0 + (q.x - m.l) / (W - m.l - m.r) * (x1 - x0), vy = y0 + (H - m.b - q.y) / (H - m.t - m.b) * (y1 - y0);
      const px = Math.round(Math.round(vx / snx) * snx * 100) / 100, py = Math.round(Math.round(vy / sny) * sny * 100) / 100;
      if (px < x0 || px > x1 || py < y0 || py > y1) return null;
      return [px, py];
    };
    const toonSpook = p => {
      if (!p || (opties.slot && opties.slot())){ spook.style.display = 'none'; return; }
      spook.style.display = '';
      const [px, py] = p, cx = X(px), cy = Y(py);
      const hx = spook.querySelector('.hx'), hy = spook.querySelector('.hy');
      hx.setAttribute('x1', X(Math.min(Math.max(0, x0), x1))); hx.setAttribute('x2', cx); hx.setAttribute('y1', cy); hx.setAttribute('y2', cy);
      hy.setAttribute('x1', cx); hy.setAttribute('x2', cx); hy.setAttribute('y1', Y(Math.min(Math.max(0, y0), y1))); hy.setAttribute('y2', cy);
      spook.querySelector('circle').setAttribute('cx', cx); spook.querySelector('circle').setAttribute('cy', cy);
      const t = spook.querySelector('text'); t.textContent = `(${px}, ${py})`.replace(/-/g, '−');
      const bw = t.textContent.length * 9 + 14, bx = cx + 14 + bw > W ? cx - 14 - bw : cx + 14, by = cy - 40 < 0 ? cy + 12 : cy - 40;
      const r = spook.querySelector('rect'); r.setAttribute('x', bx); r.setAttribute('y', by); r.setAttribute('width', bw); r.setAttribute('height', 28);
      t.setAttribute('x', bx + 7); t.setAttribute('y', by + 19);
    };
    vang.addEventListener('pointermove', ev => toonSpook(naarPunt(ev)));
    vang.addEventListener('pointerleave', () => toonSpook(null));
    const teken = () => {
      laag.innerHTML = '';
      const pts = opties.punt().slice().sort((a, b) => a[0] - b[0]);
      if (pts.length >= 2){
        const a = pts[0], b = pts[pts.length - 1];
        const ln = document.createElementNS(ns, 'line');
        Object.entries({x1: X(a[0]), y1: Y(a[1]), x2: X(b[0]), y2: Y(b[1]), stroke: '#E924D5', 'stroke-width': 3.5, 'stroke-linecap': 'round'}).forEach(([k, v]) => ln.setAttribute(k, v));
        laag.appendChild(ln);
      }
      pts.forEach(([px, py]) => { const c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', X(px)); c.setAttribute('cy', Y(py)); c.setAttribute('r', 7); c.setAttribute('fill', opties.kleurPunt ? opties.kleurPunt(px, py) : '#5E0696'); laag.appendChild(c);
        const t = document.createElementNS(ns, 'text'); t.setAttribute('x', X(px) + 10); t.setAttribute('y', Y(py) + 20); t.setAttribute('font-size', 12); t.setAttribute('font-weight', 700); t.setAttribute('fill', '#5E0696'); t.setAttribute('font-family', 'Montserrat'); t.textContent = `(${px}, ${py})`.replace(/-/g, '−'); laag.appendChild(t); });
    };
    const wissel = (px, py) => {
      const pts = opties.punt(); const i = pts.findIndex(p => p[0] === px && p[1] === py);
      if (i >= 0) pts.splice(i, 1); else pts.push([px, py]);
      teken(); opties.bijWijziging && opties.bijWijziging();
    };
    vang.addEventListener('click', ev => {
      if (opties.slot && opties.slot()) return;
      const p = naarPunt(ev); if (!p) return; wissel(p[0], p[1]); toonSpook(p);
    });
    svg._teken = teken; svg._wissel = wissel; svg._snap = [snx, sny]; teken();
  }
  return svg;
}

function bewaar(){ try { localStorage.setItem(OPSLAG, JSON.stringify(S)); } catch (e) {} wolkLater(); }
/* ---------- online opslaan met een persoonlijke code ---------- */
let DB = null;
function db(){ const c = window.APP_CONFIG || {}; if (!DB && c.SUPABASE_URL && c.SUPABASE_ANON_KEY && window.supabase) DB = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY); return DB; }
function nieuweCode(){
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = new Uint32Array(8); crypto.getRandomValues(r);
  const t = Array.from(r, x => abc[x % abc.length]).join(''); return t.slice(0, 4) + '-' + t.slice(4);
}
function normCode(c){ const t = String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return t.length === 8 ? t.slice(0, 4) + '-' + t.slice(4) : ''; }
let wolkTimer = null, wolkStatus = '';
function zetWolkStatus(t){ wolkStatus = t; const e = document.getElementById('wolk'); if (e) e.textContent = t; }
function wolkLater(){ if (!S.code || !db()) return; clearTimeout(wolkTimer); zetWolkStatus('Opslaan…'); wolkTimer = setTimeout(wolkNu, 1200); }
async function wolkNu(){
  clearTimeout(wolkTimer); if (!S.code || !db()) return;
  try {
    const {error} = await db().rpc('voortgang_opslaan', {p_code: S.code, p_leerling: S.naam || 'onbekend', p_klas: S.klas || null, p_data: S});
    if (error) throw error; zetWolkStatus('✓ Opgeslagen');
  } catch (e) { zetWolkStatus('⚠ Niet opgeslagen (geen internet?)'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') wolkNu(); });
function st(id){ if (!S.items[id]) S.items[id] = {pogingen: [], hint: 0, opgelost: false, punten: null, tijd: 0, gezien: null, laatste: null, hulpGetoond: false, invoer: null}; return S.items[id]; }
function puntenVan(s){ if (!s.opgelost) return 0; const fouten = s.pogingen.filter(p => !p.goed).length; if (fouten === 0 && !s.hint) return 2; if (fouten <= 1) return 1; return 0; }

}

      + `<div class="pogingen">Typ een min als - en een keer als * of ×.</div>`;
  } else if (it.type === 'tabel'){

      <tr><th>${fmtF(it.kop[1])}</th>${it.ans.map((a, k) => (it.gegeven || []).includes(k) ? `<td class="gegeven">${String(a).replace('-', '−')}</td>` : `<td><input id="c${k}" inputmode="decimal" autocomplete="off" aria-label="${esc(it.kop[1])} bij ${esc(it.kop[0])} = ${it.xs[k]}"></td>`).join('')}</tr></table></div>`;
  } else if (it.type === 'stappen'){

  } else if (it.type === 'mk'){

      inv.querySelectorAll('.optie').forEach(x => { const on = s.keuze.includes(+x.dataset.k); x.classList.toggle('gekozen', on); x.setAttribute('aria-pressed', on); });
    });
  }
  herstelInvoer(it, s);
  $('#controleer').onclick = () => controleer(it);
  $('#hintKnop').onclick = () => toonHint(it);

  toonStatus(it);

function herstelInvoer(it, s){
  const w = s.waarden || {};
  Object.entries(w).forEach(([id, v]) => { const e = document.getElementById(id); if (e) e.value = v; });
  if (it.type === 'mk' && s.keuze) document.querySelectorAll('.optie').forEach(x => x.classList.toggle('gekozen', s.keuze.includes(+x.dataset.k)));
  if (s.hint){ const hv = $('#hintvak'); hv.classList.add('open'); hv.innerHTML = it.hint.slice(0, s.hint).map((h, k) => `<div><b>Hint ${k + 1}:</b> ${fmtF(h)}</div>`).join(''); }
}
function verzamel(it){
  const w = {}; document.querySelectorAll('#invoer input, #invoer select').forEach(e => w[e.id] = e.value); return w;
}
function toonStatus(it){
  const s = st(it.id); const fb = $('#feedback'); const pg = $('#pogingen');
  const n = s.pogingen.length;
  pg.textContent = n ? `Pogingen: ${n}${s.hint ? ' · hint gebruikt' : ''}` : '';
  if (s.opgelost){
    const p = puntenVan(s);
    fb.className = 'feedback goed';
    fb.innerHTML = `Goed zo! Je krijgt ${p} ${p === 1 ? 'punt' : 'punten'}.<br>${it.uitleg.map(u => fmtF(u)).join('<br>')}`;
    document.querySelectorAll('#invoer input, #invoer select').forEach(e => { e.disabled = true; });
    $('#controleer').disabled = true; $('#hintKnop').disabled = true;
  }
}

/* ---------- nakijken ---------- */
function controleer(it){
  const s = st(it.id); if (s.opgelost) return;
  const w = verzamel(it); s.waarden = w;
  let goed = false, cat = '', leeg = false, schrijf = '';
  const markeer = (id, ok) => { const e = document.getElementById(id); if (e){ e.classList.toggle('goed', ok); e.classList.toggle('fout', !ok); } };
  const NUMMSG = 'Typ in elk vakje alleen een getal, bijvoorbeeld 90 of −7.';
  if (it.type === 'num'){
    const v = parseNum(w.a0); leeg = w.a0.trim() === '';
    if (!leeg && isNaN(v)) schrijf = 'Typ alleen een getal, bijvoorbeeld 90 of −7.';
    goed = Math.abs(v - it.ans) < 1e-9;
    if (!goed && !leeg){ cat = (it.fouten && it.fouten[String(v)]) || (Math.abs(v + it.ans) < 1e-9 ? 'Min-teken fout' : 'Rekenfout'); }
    if (!schrijf) markeer('a0', goed);
  } else if (it.type === 'tijd'){
    leeg = w.a0.trim() === '';
    const v = parseTijd(w.a0); goed = v === parseTijd(it.ans);
    if (!leeg && v == null) schrijf = 'Schrijf de tijd zo: 9:30 (uren, dubbele punt, minuten).';
    if (!goed && !leeg){ const k = v == null ? '' : `${Math.floor(v / 60)}:${String(v % 60).padStart(2, '0')}`; cat = (it.fouten && it.fouten[k]) || 'Afleesfout of rekenfout bij de tijd'; }
    if (!schrijf) markeer('a0', goed);
  } else if (it.type === 'tabel'){
    let fout = 0, min = 0, leegVak = 0, onleesbaar = 0; leeg = true; const res = [];
    it.ans.forEach((a, k) => { if ((it.gegeven || []).includes(k)) return; const raw = w['c' + k]; const v = parseNum(raw);
      if (raw.trim() === '') leegVak++; else { leeg = false; if (isNaN(v)) onleesbaar++; }
      const ok = Math.abs(v - a) < 1e-9; res.push(['c' + k, ok]); if (!ok){ fout++; if (Math.abs(v + a) < 1e-9 && a !== 0) min++; } });
    if (!leeg && onleesbaar) schrijf = NUMMSG; else if (!leeg && leegVak) schrijf = 'Vul eerst alle vakjes van de tabel in.';
    if (!schrijf) res.forEach(([id, ok]) => markeer(id, ok));
    goed = fout === 0;
    if (!goed && !leeg) cat = min ? `Min-teken fout in de tabel (${fout} ${fout === 1 ? 'vakje' : 'vakjes'} fout)` : `Rekenfout in de tabel (${fout} ${fout === 1 ? 'vakje' : 'vakjes'} fout)`;
  } else if (it.type === 'stappen'){
    let fout = 0; leeg = true; let eerste = '', leegVak = 0, onleesbaar = 0, geenKeuze = 0; const res = [];
    const getal = (id, ans, catVeld) => { const raw = w[id] || ''; const v = parseNum(raw);
      if (raw.trim() === '') leegVak++; else { leeg = false; if (isNaN(v)) onleesbaar++; }
      const ok = Math.abs(v - ans) < 1e-9;
      if (!ok && !eerste && raw.trim() !== '') eerste = catVeld || (it.fouten && it.fouten[String(v)]) || (!isNaN(v) && Math.abs(v + ans) < 1e-9 && ans !== 0 ? 'Min-teken fout' : '');
      res.push([id, ok]); if (!ok) fout++; };
    it.velden.forEach((f, k) => {
      if (f.tpl){ f.ans.forEach((a, j) => getal(`a${k}_${j}`, a, f.invul && j === 0 ? 'Verkeerd getal ingevuld in de formule' : '')); return; }
      if (f.soort === 'keuze'){ const raw = w['a' + k]; const ok = +raw === f.ans; if (+raw === 0) geenKeuze++; else leeg = false; if (!ok && !eerste && +raw !== 0) eerste = 'Verkeerde grafiek gekozen'; res.push(['a' + k, ok]); if (!ok) fout++; }
      else getal('a' + k, f.ans);
    });
    if (!leeg && onleesbaar) schrijf = NUMMSG; else if (!leeg && leegVak) schrijf = 'Vul eerst alle vakjes in.'; else if (!leeg && geenKeuze) schrijf = 'Kies ook een grafiek.';
    if (!schrijf) res.forEach(([id, ok]) => markeer(id, ok));
    goed = fout === 0; if (!goed && !leeg) cat = eerste || 'Rekenfout in een tussenstap';
  } else if (it.type === 'mk'){
    const k = (s.keuze || []).slice().sort(); leeg = k.length === 0;
    const ans = (it.multi ? it.ans : [it.ans]).slice().sort();
    if (!leeg && it.multi && k.length !== ans.length) schrijf = `Kies ${ans.length} antwoorden.`;
    goed = k.length === ans.length && k.every((v, i) => v === ans[i]);
    if (!schrijf) document.querySelectorAll('.optie').forEach(x => { x.classList.remove('goed', 'fout'); if (k.includes(+x.dataset.k)) x.classList.add(goed ? 'goed' : 'fout'); });
    if (!goed && !leeg) cat = 'Verkeerde keuze gemaakt';
  } else if (it.type === 'formule'){
    const n = it.aantal || 1; const ok = []; leeg = true; const res = [];
    const uit = vergelijking(it.orig).uit; const letters = it.vars.concat(uit);
    const gezien = new Set([normFormule(it.orig)]);
    let leegVak = 0;
    for (let k = 0; k < n; k++){
      const raw = w['a' + k] || ''; if (raw.trim()) leeg = false; else { leegVak++; ok.push(false); res.push(['a' + k, false]); continue; }
      let r = false, c = '';
      const nf = normFormuleX(raw, letters);
      const vreemd = (nf.match(/[a-z]/g) || []).filter(l => !letters.includes(l));
      if ((nf.match(/=/g) || []).length !== 1){ if (!schrijf) schrijf = `Een formule heeft één = teken. Bijvoorbeeld: ${it.begin || uit} = …`; }
      else if (vreemd.length){ if (!schrijf) schrijf = `Gebruik alleen de letters ${letters.join(' en ')}. Je typte: ${[...new Set(vreemd)].join(', ')}.`; }
      else if ((nf.match(/\(/g) || []).length !== (nf.match(/\)/g) || []).length){ if (!schrijf) schrijf = 'Er ontbreekt een haakje. Controleer of elk ( ook een ) heeft.'; }
      else {
        try {
          vergelijking(nf);
          if (it.zonderKeer && /\*/.test(nf)) c = '×-teken niet weggelaten';
          else if (n > 1 && (nf === normFormule(it.orig) || gezien.has(nf))) c = 'Zelfde formule als de gegeven formule (of twee keer dezelfde)';
          else if (it.begin && !nf.startsWith(it.begin + '=')) c = `Begin met ${it.begin} =`;
          else if (it.moetStarten && !nf.startsWith(it.begin + '=' + it.moetStarten)) c = 'Wat links en rechts van het + teken staat is niet verwisseld';
          else if (gelijkwaardig(it.orig, nf, it.vars)) r = true;
          else c = (/\(/.test(it.orig) && !/\(/.test(nf)) ? 'Haakjes vergeten' : 'Formule is niet gelijkwaardig aan de gegeven formule';
          gezien.add(nf);
        } catch (e) { if (!schrijf) schrijf = `Deze formule kan ik niet lezen. Schrijf hem bijvoorbeeld zo: ${it.begin || uit} = …`; }
      }
      res.push(['a' + k, r]); ok.push(r); if (!r && !cat) cat = c;
    }
    if (!schrijf && !leeg && leegVak) schrijf = n > 1 ? 'Vul beide manieren in.' : '';
    if (!schrijf) res.forEach(([id, r]) => markeer(id, r));
    goed = ok.every(Boolean);
  } else if (it.type === 'grafiek'){
    const pts = s.invoer || []; leeg = pts.length === 0;
    const fout = pts.filter(([x, y]) => Math.abs(it.f(x) - y) > 1e-9);
    if (!leeg && pts.length < it.min && !fout.length) schrijf = `Zet minstens ${it.min} punten.`;
    goed = pts.length >= it.min && fout.length === 0;
    if (!goed && !leeg) cat = `Punt ligt niet op de grafiek (${fout.map(p => '(' + p.join(', ') + ')').join(' ').replace(/-/g, '−')})`;
  }
  const fb = $('#feedback');
  if (leeg){ fb.className = 'feedback info'; fb.textContent = 'Vul eerst een antwoord in.'; return; }
  if (schrijf){ fb.className = 'feedback info'; fb.innerHTML = `${fmtF(schrijf)}<br><span style="font-weight:500">Dit telt niet als fout. Pas het aan en klik opnieuw op Controleer.</span>`; return; }
  const t = nu(); const dt = t - (s.laatste || t); s.laatste = t;
  s.pogingen.push({goed, cat, ms: dt, keuze: it.type === 'mk' ? (s.keuze || []).slice() : undefined, hint: s.hint});
  s.tijd = t - s.gezien;
  if (goed){ s.opgelost = true; s.punten = puntenVan(s); bewaar(); toonStatus(it); updateStrook(); if (it.type === 'grafiek') document.querySelector('svg.graf')._teken(); return; }
  bewaar();
  const fouten = s.pogingen.filter(p => !p.goed).length;
  fb.className = 'feedback fout';
  fb.innerHTML = `Nog niet goed.${cat ? '<br>' + fmtF(cat) + '.' : ''}<br>${fouten === 1 ? 'Kijk nog eens goed en probeer het opnieuw.' : fouten === 2 ? 'Gebruik de hint als je vastzit.' : 'Probeer het nog een keer.'}`;
  $('#pogingen').textContent = `Pogingen: ${s.pogingen.length}${s.hint ? ' · hint gebruikt' : ''}`;
  updateStrook();
  if (fouten >= 4 && !s.hulpGetoond){ s.hulpGetoond = true; bewaar(); toonHulp(it); }
}
function updateStrook(){
  const it = ITEMS[S.huidig]; const b = document.querySelector(`.stip[data-i="${S.huidig}"]`); if (!b) return;
  const s = S.items[it.id]; b.classList.remove('goed0', 'goed1', 'goed2', 'bezig');
  if (s.opgelost) b.classList.add('goed' + puntenVan(s)); else if (s.pogingen.length) b.classList.add('bezig');
  const v = document.querySelector('.voortgang'); if (v) v.textContent = `${VRAGEN.filter(x => S.items[x.id] && S.items[x.id].opgelost).length} van ${VRAGEN.length} opdrachten af`;
}
function toonHint(it){
  const s = st(it.id); if (s.opgelost) return;
  s.hint = Math.min(it.hint.length, (s.hint || 0) + 1); bewaar();
  const hv = $('#hintvak'); hv.classList.add('open');
  hv.innerHTML = it.hint.slice(0, s.hint).map((h, k) => `<div><b>Hint ${k + 1}:</b> ${fmtF(h)}</div>`).join('')
    + (s.hint >= it.hint.length ? '' : '<div style="font-size:13px;margin-top:6px">Klik nog een keer op Hint voor meer hulp.</div>');
  $('#pogingen').textContent = `Pogingen: ${s.pogingen.length} · hint gebruikt`;
}
function toonHulp(it){
  const ov = $('#overlay'); const inh = $('#ovInhoud');
  inh.innerHTML = `<p>Je hebt het nu vier keer geprobeerd.<br>Hier zie je stap voor stap hoe het werkt.</p>` + it.uitleg.map((u, k) => `<div class="ov-stap"><span class="nr">${k + 1}</span>${fmtF(u)}</div>`).join('');
  if (it.type === 'grafiek'){ const g = maakGrafiek(it.g, {lijnen: [{f: it.f}]}); g.style.maxWidth = '440px'; inh.appendChild(g); }
  ov.hidden = false;
  inh.querySelectorAll('.ov-stap').forEach((e, k) => setTimeout(() => e.classList.add('zichtbaar'), 400 + k * 1100));
  $('#ovSluit').focus();
}
$('#ovSluit').onclick = () => { $('#overlay').hidden = true; };

function startScherm(){
  const online = !!db();
  const terug = S.naam && Object.keys(S.items).length;
  app.innerHTML = `<div class="scherm" style="grid-row:1/-1">
    <span class="label-domein">VMBO Basis · Hoofdstuk 2 Formules</span>

function analyse(){
  let behaald = 0; const totaal = VRAGEN.length * 2; const regels = []; const cats = {};
  let alle = 0, snel = 0, spreiding = 0, rits = 0;
  VRAGEN.forEach(v => {
    const s = S.items[v.id];
    const naam = `Vraag ${v.nr === 'Leerdoelen' ? 'Leerdoelen ' : v.nr}${v.deel ? (v.nr === 'Leerdoelen' ? '' : '') + v.deel.replace(/\s+/g, '') : ''}`;
    if (!s || !s.pogingen.length){ regels.push({naam, tekst: 'Overgeslagen', punten: 0, pogingen: 0, tijd: 0, fouten: []}); return; }
    const p = puntenVan(s); behaald += p;
    const fouten = s.pogingen.filter(x => !x.goed).map(x => x.cat).filter(Boolean);
    fouten.forEach(c => { const k = c.replace(/\s*\(.*\)$/, ''); cats[k] = (cats[k] || 0) + 1; });
    alle += s.pogingen.length;
    s.pogingen.forEach((x, i) => { if (x.ms < 3000) snel++; if (i > 0 && !x.goed && !s.pogingen[i - 1].goed && x.ms < 5000 && !x.hint) rits++; });
    if (v.type === 'mk' && !v.multi){ const geprobeerd = new Set(s.pogingen.map(x => (x.keuze || [])[0])); if (geprobeerd.size >= v.opties.length - 1 && v.opties.length >= 3) spreiding++; }
    const t = sec(s.tijd || 0);
    let tekst;
    if (!s.opgelost) tekst = `0 pt (Niet afgemaakt; Fout: ${fouten[fouten.length - 1] || 'onbekend'}; Pogingen: ${s.pogingen.length}, Tijd: ${t}s)`;
    else if (p === 2) tekst = `Goed (Pogingen: ${s.pogingen.length}, Tijd: ${t}s)`;
    else tekst = `${p} pt (${fouten.length ? 'Fout: ' + fouten[0] + '; ' : 'Hint gebruikt; '}Pogingen: ${s.pogingen.length}, Tijd: ${t}s)`;
    if (s.rekenmachine) tekst = tekst.replace(/\)$/, ', rekenmachine gebruikt)');
    regels.push({naam, tekst, punten: p, pogingen: s.pogingen.length, tijd: t, fouten, hint: s.hint || 0, rekenmachine: s.rekenmachine || 0});
  });
  const cijfer = Math.min(10, Math.max(1, Math.round(((behaald / totaal) * 9 + 1) * 10) / 10));
  const gokScore = alle ? (snel + spreiding * 3 + rits) / alle : 0;
  const gok = gokScore < .15 ? 'Laag' : gokScore < .35 ? 'Gemiddeld' : 'Hoog';
  const top = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const ADVIES = {
    'Min-teken fout': 'Oefen min × min = plus en min − min = plus met de getallenlijn.',
    'Min × min = plus vergeten': 'Herhaal de regel: min keer min is plus.',
    'Min min wordt plus vergeten': 'Herhaal: iets aftrekken van een negatief getal is optellen (6 − −2 = 6 + 2).',
    '×-teken niet weggelaten': 'Laat zien dat 6 × k korter wordt geschreven als 6k.',
    'Haakjes vergeten': 'Laat zien dat bij korter schrijven de haakjes blijven staan.',
    'Rekenfout in de tabel': 'Laat de leerling eerst één vakje hardop uitrekenen.',
    'Min-teken fout in de tabel': 'Oefen het invullen van negatieve getallen met een getallenlijn.',
    'Punt ligt niet op de grafiek': 'Laat de leerling punten uit de tabel overnemen in het assenstelsel.',
    'Formule is niet gelijkwaardig aan de gegeven formule': 'Laat met een tabel controleren of twee formules gelijkwaardig zijn.',
    'Verkeerde keuze gemaakt': 'Laat de leerling eerst de tabellen vergelijken voordat hij kiest.'
  };
  const tip = top.length ? (ADVIES[top[0][0]] || `Meest gemaakte fout: "${top[0][0]}". Bespreek deze opdrachten samen.`) : (behaald === totaal ? 'Alles in één keer goed: geef deze leerling uitdagende opdrachten.' : 'Laat de leerling de overgeslagen opdrachten nog maken.');
  return {behaald, totaal, cijfer, gok, regels, cats: top, tip, snel, spreiding, rits, alle};
}

/* =========================================================
   REKENMACHINE (examenmodel)
   Tokens: getallen/tekens als array, met cursor.
   ========================================================= */
const RM = {tok: [], cur: 0, inv: false, ans: 0, uit: null, toonBreuk: true, modus: 'math', klaar: false, fout: ''};
const RM_TONEN = {'sin(': 'sin(', 'cos(': 'cos(', 'tan(': 'tan(', 'asin(': 'sin⁻¹(', 'acos(': 'cos⁻¹(', 'atan(': 'tan⁻¹(', '√(': '√(', '^(': '^(', '×10^(': '×10^(',
  '²': '²', '⁻¹': '⁻¹', 'π': 'π', 'Ans': 'Ans', '⁄': '⁄', 'neg': '−', '−': ' − ', '+': ' + ', '×': ' × ', '÷': ' ÷ ', '(': '(', ')': ')', ',': ','};
function rmDelen(tokens){
  return tokens.map((t, i) => {
    if (t === '−'){ const v = i > 0 ? tokens[i - 1] : null; if (v == null || ['+', '−', '×', '÷', 'neg', '⁄'].includes(v) || /\($/.test(v)) return '−'; }
    return RM_TONEN[t] != null ? RM_TONEN[t] : t; });
}
function rmTekst(tokens){ return rmDelen(tokens).join(''); }
function rmBewerk(pos){ RM.klaar = false; RM.oud = true; RM.cur = Math.max(0, Math.min(RM.tok.length, pos)); }
function rmInvoegen(t){
  if (RM.klaar){
    RM.klaar = false;
    // verder rekenen met het antwoord als je met een bewerking begint
    if (['+', '−', '×', '÷', '²', '⁻¹', '^(', '⁄', '×10^('].includes(t)){ RM.tok = ['Ans']; RM.cur = 1; }
    else { RM.tok = []; RM.cur = 0; }
  }
  RM.tok.splice(RM.cur, 0, t); RM.cur++;
}
function rmToets(t){
  RM.fout = '';
  const inv = RM.inv; if (t !== 'INV') RM.inv = false;
  switch (t){
    case 'INV': RM.inv = !RM.inv; break;
    case 'C': if (inv){ RM.ans = 0; } RM.tok = []; RM.cur = 0; RM.uit = null; RM.klaar = false; break;
    case 'DEL': if (RM.klaar) rmBewerk(RM.tok.length); if (RM.cur > 0){ RM.tok.splice(RM.cur - 1, 1); RM.cur--; } break;
    case 'links': if (RM.klaar){ rmBewerk(RM.tok.length); break; } RM.cur = Math.max(0, RM.cur - 1); break;
    case 'rechts': if (RM.klaar){ rmBewerk(0); break; } RM.cur = Math.min(RM.tok.length, RM.cur + 1); break;
    case 'sin': case 'cos': case 'tan': rmInvoegen((inv ? 'a' : '') + t + '('); break;
    case 'wortel': rmInvoegen('√('); break;
    case 'kw': rmInvoegen('²'); break;
    case 'macht': rmInvoegen('^('); break;
    case 'inv1': rmInvoegen('⁻¹'); break;
    case 'pi': rmInvoegen('π'); break;
    case 'e10': rmInvoegen('×10^('); break;
    case 'breuk': rmInvoegen('⁄'); break;
    case 'neg': rmInvoegen('neg'); break;
    case 'ANS': rmInvoegen('Ans'); break;
    case 'haak': {
      const voor = RM.klaar ? [] : RM.tok.slice(0, RM.cur);
      const open = voor.filter(x => /\($/.test(x)).length - voor.filter(x => x === ')').length;
      const laatste = voor[voor.length - 1];
      const naGetal = laatste != null && (/^[0-9,]$/.test(laatste) || [')', 'π', 'Ans', '²', '⁻¹'].includes(laatste));
      rmInvoegen(open > 0 && naGetal ? ')' : '('); break;
    }
    case 'fd': if (RM.uit != null) RM.toonBreuk = !RM.toonBreuk; break;
    case '=': rmBereken(); break;
    default: rmInvoegen(t);
  }
  rmTeken();
}
function rmParse(tokens){
  // maak er een lijst van eenheden van: getallen samenvoegen
  const L = []; let num = '';
  const flush = () => { if (num){ if (!/^\d*,?\d+$|^\d+,$/.test(num)) throw new Error('Syntax'); L.push({t: 'n', v: parseFloat(num.replace(',', '.'))}); num = ''; } };
  tokens.forEach(t => { if (/^[0-9,]$/.test(t)) num += t; else { flush(); L.push({t}); } });
  flush();
  let p = 0; const pk = () => L[p], neem = () => L[p++];
  const isStart = x => x && (x.t === 'n' || x.t === 'π' || x.t === 'Ans' || x.t === '(' || /\($/.test(x.t) && x.t !== '^(' && x.t !== '×10^(' || x.t === 'neg');
  function expr(){ let v = term(); while (pk() && (pk().t === '+' || pk().t === '−')){ const o = neem().t; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function term(){ let v = unair();
    for (;;){ const x = pk(); if (!x) break;
      if (x.t === '×' || x.t === '÷'){ p++; const r = unair(); if (x.t === '÷' && r === 0) throw new Error('Wiskundefout'); v = x.t === '×' ? v * r : v / r; }
      else if (x.t === '×10^('){ p++; const e = expr(); sluit(); v = v * Math.pow(10, e); }
      else if (isStart(x) && x.t !== 'neg'){ v = v * unair(); }   // impliciet keer, bv. 2π of 3(4)
      else break; }
    return v; }
  function unair(){ if (pk() && (pk().t === 'neg' || pk().t === '−')){ p++; return -unair(); } if (pk() && pk().t === '+'){ p++; return unair(); } return breuk(); }
  function breuk(){ let v = macht(); while (pk() && pk().t === '⁄'){ p++; const r = macht(); if (r === 0) throw new Error('Wiskundefout'); v = v / r; } return v; }
  function macht(){ let v = post(); if (pk() && pk().t === '^('){ p++; const e = expr(); sluit(); v = Math.pow(v, e); if (isNaN(v)) throw new Error('Wiskundefout'); } return v; }
  function post(){ let v = prim(); while (pk() && (pk().t === '²' || pk().t === '⁻¹')){ const o = neem().t; if (o === '²') v = v * v; else { if (v === 0) throw new Error('Wiskundefout'); v = 1 / v; } } return v; }
  function sluit(){ if (pk() && pk().t === ')') p++; /* een vergeten sluithaakje aan het eind mag */ else if (pk()) throw new Error('Syntax'); }
  const RAD = Math.PI / 180;
  function prim(){ const x = neem(); if (!x) throw new Error('Syntax');
    if (x.t === 'n') return x.v;
    if (x.t === 'π') return Math.PI;
    if (x.t === 'Ans') return RM.ans;
    if (x.t === '('){ const v = expr(); sluit(); return v; }
    if (x.t === '√('){ const v = expr(); sluit(); if (v < 0) throw new Error('Wiskundefout'); return Math.sqrt(v); }
    const f = {'sin(': v => Math.sin(v * RAD), 'cos(': v => Math.cos(v * RAD), 'tan(': v => Math.tan(v * RAD), 'asin(': v => Math.asin(v) / RAD, 'acos(': v => Math.acos(v) / RAD, 'atan(': v => Math.atan(v) / RAD}[x.t];
    if (f){ const v = f(expr()); sluit(); if (isNaN(v)) throw new Error('Wiskundefout'); return Math.abs(v) < 1e-12 ? 0 : v; }
    throw new Error('Syntax'); }
  if (!L.length) throw new Error('leeg');
  const v = expr(); if (p !== L.length) throw new Error('Syntax'); return v;
}
function rmBereken(){
  if (!RM.tok.length) return;
  try { const v = rmParse(RM.tok); if (!isFinite(v)) throw new Error('Wiskundefout'); RM.ans = Math.round(v * 1e12) / 1e12; RM.uit = RM.ans; RM.toonBreuk = true; RM.klaar = true; RM.oud = false; }
  catch (e) { RM.fout = e.message === 'Wiskundefout' ? 'Wiskundefout' : 'Syntaxfout'; RM.uit = null; }
}
function rmBreuk(v){ // geeft [teller, noemer] als v een nette breuk is
  if (Number.isInteger(v)) return null;
  let h1 = 1, h0 = 0, k1 = 0, k0 = 1, x = Math.abs(v);
  for (let i = 0; i < 20; i++){ const a = Math.floor(x); [h1, h0] = [a * h1 + h0, h1]; [k1, k0] = [a * k1 + k0, k1];
    if (Math.abs(Math.abs(v) - h1 / k1) < 1e-10) return k1 <= 9999 ? [Math.sign(v) * h1, k1] : null; x = 1 / (x - a); if (!isFinite(x)) break; }
  return null;
}
function rmGetal(v){ let s = String(+v.toPrecision(10)); if (s.includes('e')) s = v.toExponential(6); return s.replace('.', ',').replace(/^-/, '−').replace('e', '×10^'); }
function rmTeken(){
  const lin = RM.modus === 'lin';
  $('#rmIndInv').textContent = RM.inv ? 'INV' : ''; $('#rmIndModus').textContent = lin ? 'Lin' : 'Math';
  $('#rmInv').classList.toggle('aan', RM.inv);
  const delen = rmDelen(RM.tok);
  const fmtIn = t => lin ? esc(t) : esc(t).replace(/²/g, '<sup>2</sup>').replace(/⁻¹/g, '<sup>−1</sup>');
  const caret = RM.klaar ? '' : '<span class="caret"></span>';
  $('#rmIn').innerHTML = delen.map((d, i) => (i === RM.cur ? caret : '') + `<span class="tk" data-i="${i}">${fmtIn(d)}</span>`).join('') + (RM.cur >= delen.length ? caret : '');
  const c = $('#rmIn .caret'); const rin = $('#rmIn'); if (c) rin.scrollLeft = Math.max(0, c.offsetLeft - rin.clientWidth + 30); else rin.scrollLeft = 0;
  $('#rmUit').classList.toggle('oud', !!RM.oud);
  const el = $('#rmUit');
  if (RM.fout){ el.textContent = RM.fout; return; }
  if (RM.uit == null){ el.textContent = ''; return; }
  const b = RM.toonBreuk ? rmBreuk(RM.uit) : null;
  if (b){ const neg = b[0] < 0 ? '−' : '';
    el.innerHTML = lin ? `${neg}${Math.abs(b[0])}⌟${b[1]}` : `${neg}<span class="breuk"><span>${Math.abs(b[0])}</span><span>${b[1]}</span></span>`; }
  else el.textContent = rmGetal(RM.uit);
}
function rmToggle(open){
  const rm = $('#rm'); const aan = open == null ? rm.hidden : open; rm.hidden = !aan;
  const b = $('#rmOpen'); if (b) b.setAttribute('aria-pressed', aan);
  if (aan){
    const it = ITEMS[S.huidig]; if (it && !it.theorie){ const s = st(it.id); s.rekenmachine = (s.rekenmachine || 0) + 1; bewaar(); }
    rmTeken(); $('#rmLcd').focus({preventScroll: true});
  }
}
let rmDoel = null;   // het laatst gekozen antwoordvak
document.addEventListener('focusin', e => { const t = e.target; if (t.matches && t.matches('input') && t.closest('#main') && !t.disabled) rmDoel = t; });
function rmKopieer(){
  const m = $('#rmMelding');
  if (!RM.klaar || RM.uit == null){ m.textContent = 'Maak eerst een berekening en druk op =.'; return; }
  const som = rmTekst(RM.tok).replace(/\s+/g, ' ').trim();
  const b = RM.toonBreuk ? rmBreuk(RM.uit) : null;
  const antw = b ? `${b[0] < 0 ? '−' : ''}${Math.abs(b[0])}/${b[1]}` : rmGetal(RM.uit);
  const regel = `${som} = ${antw}`;
  // in het antwoordvak zetten
  const doel = rmDoel && document.body.contains(rmDoel) && !rmDoel.disabled ? rmDoel : document.querySelector('#invoer input:not([disabled])');
  if (doel){ doel.value = antw; doel.dispatchEvent(new Event('input', {bubbles: true})); doel.classList.remove('goed', 'fout'); doel.focus({preventScroll: true}); }
  // berekening bewaren bij de vraag, zoals op het examen
  const it = ITEMS[S.huidig];
  if (it && !it.theorie){ const st2 = st(it.id); st2.berekeningen = (st2.berekeningen || []).concat(regel).slice(-12); bewaar(); toonBerekeningen(it); }
  try { navigator.clipboard && navigator.clipboard.writeText(regel).catch(() => {}); } catch (e) {}
  m.textContent = doel ? `Gekopieerd: ${regel}` : `Gekopieerd: ${regel} (klik eerst in een antwoordvak)`;
}
function toonBerekeningen(it){
  const vak = document.getElementById('berekeningen'); if (!vak) return;
  const lijst = (S.items[it.id] && S.items[it.id].berekeningen) || [];
  vak.innerHTML = lijst.length ? '<span style="font-size:13px;color:var(--zacht);width:100%">Jouw berekeningen:</span>' + lijst.map(r => `<span class="berekening">${esc(r)}</span>`).join('') : '';
}
$('#rmIn').addEventListener('click', e => {
  const tk = e.target.closest('.tk'); let pos = RM.tok.length;
  if (tk){ const r = tk.getBoundingClientRect(); pos = +tk.dataset.i + (e.clientX > r.left + r.width / 2 ? 1 : 0); }
  if (RM.klaar) rmBewerk(pos); else RM.cur = pos;
  $('#rmMelding').textContent = ''; rmTeken();
});
$('#rmToetsen').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.t === 'kopieer') return rmKopieer(); $('#rmMelding').textContent = ''; rmToets(b.dataset.t); });
document.querySelectorAll('input[name="rmModus"]').forEach(r => r.onchange = () => { RM.modus = r.value; rmTeken(); });
$('#rmSluit').onclick = () => rmToggle(false);
$('#rmKlap').onclick = () => { const rm = $('#rm'); const dicht = rm.classList.toggle('ingeklapt'); $('#rmKlap').textContent = dicht ? '▲' : '▼'; $('#rmKlap').setAttribute('aria-expanded', !dicht); };
$('#rm').addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  const map = {'*': '×', 'x': '×', '/': '÷', ':': '÷', '-': '−', '.': ',', ',': ',', '+': '+', 'Enter': '=', '=': '=', 'Backspace': 'DEL', 'Delete': 'C', 'Escape': 'C', 'ArrowLeft': 'links', 'ArrowRight': 'rechts', '(': 'haak', ')': 'haak', '^': 'macht'};
  const t = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
  if (t){ e.preventDefault(); rmToets(t); }
});
// slepen: aan de titelbalk of de grijze behuizing
(() => { const rm = $('#rm'); let dx, dy, sleep = false, id = null;
  rm.addEventListener('pointerdown', e => {
    if (e.target.closest('button, input, label, .rm-lcd')) return;
    sleep = true; id = e.pointerId; const r = rm.getBoundingClientRect(); dx = e.clientX - r.left; dy = e.clientY - r.top;
    rm.setPointerCapture(id); e.preventDefault(); });
  rm.addEventListener('pointermove', e => { if (!sleep || e.pointerId !== id) return;
    const x = Math.min(Math.max(0, e.clientX - dx), innerWidth - Math.min(rm.offsetWidth, innerWidth)), y = Math.min(Math.max(0, e.clientY - dy), innerHeight - 50);
    rm.style.left = x + 'px'; rm.style.top = y + 'px'; rm.style.right = 'auto'; rm.style.bottom = 'auto'; });
  const stop = () => { sleep = false; id = null; };
  rm.addEventListener('pointerup', stop); rm.addEventListener('pointercancel', stop);
})();
rmTeken();

render();
</script>
